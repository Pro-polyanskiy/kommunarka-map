<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Коммунарка — где тихо, чисто и зелено</title>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link href="style.css" rel="stylesheet"></head><body>
<aside id="side">
 <header><h1>Коммунарка</h1><p>Где тихо, чисто, зелено и не жарко. Нажмите на любое место карты.</p>
  <div class="search"><input id="q" placeholder="Поиск: ЖК, микрорайон, посёлок" autocomplete="off"><div id="sug"></div></div></header>
 <nav><button data-t="layers" class="on">Слои</button><button data-t="rank">Рейтинг мест</button><button data-t="about">О данных</button></nav>
 <section id="t-layers" class="tab on"><div id="layers"></div><div id="legend"></div>
  <div class="opts"><label><input type="checkbox" id="o-bld" checked> 3D-дома, окрашенные по шуму</label>
  <label><input type="checkbox" id="o-scr" checked> Шумозащитные экраны</label>
  <label><input type="checkbox" id="o-sat"> Спутниковый снимок</label>
  <label>Прозрачность слоя <input type="range" id="o-op" min="0" max="100" value="65"></label></div></section>
 <section id="t-rank" class="tab"><div class="rf"><button data-k="all" class="on">Все</button><button data-k="micro">Микрорайоны и ЖК</button><button data-k="place">Посёлки</button></div><ol id="rank"></ol></section>
 <section id="t-about" class="tab" id="about"></section>
</aside>
<main id="map"></main>
<div id="card" class="hidden"></div>
<div class="ctl"><button id="b3d" title="2D / 3D">3D</button><button id="bloc" title="Где я">◎</button></div>
<script src="app.js"></script></body></html>
